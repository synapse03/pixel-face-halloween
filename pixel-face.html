<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pixel Face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Press Start 2P Local";src:url("fonts/PressStart2P-Regular.ttf") format("truetype");font-display:swap}
:root{
  --bg:#000000;
  --ink:#c9cde0;
  --dim:#6a7090;
  --cap:#12141c;
  --cap-edge:#262a3b;
  --cap-on:#1f2338;
  --hot:#ffffff;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; } }
:root[data-theme="dark"]{ --bg:#000000; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{font-family:"Press Start 2P","Press Start 2P Local",ui-monospace,"Courier New",monospace;color:var(--ink);-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#bgc,#glow{pointer-events:none}
#glow{width:auto;height:auto}
.crt{position:fixed;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%);}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);left:50%;transform:translate(-50%,-6px);
  font-size:12px;letter-spacing:.06em;color:var(--hot);text-shadow:0 0 10px rgba(255,255,255,.55);
  opacity:0;transition:opacity .35s, transform .35s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.keys{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 12px;transition:opacity .3s, transform .3s}
.keys.hidden{opacity:0;transform:translateY(14px);pointer-events:none}
.keys button{font:inherit;font-size:8px;line-height:1;color:var(--dim);background:var(--cap);border:0;border-radius:0;
  box-shadow:inset 0 -3px 0 var(--cap-edge);padding:7px 8px 10px;cursor:pointer;display:flex;gap:7px;align-items:center}
.keys button kbd{font:inherit;color:var(--ink)}
.keys button:hover{color:var(--ink)}
.keys button[aria-pressed="true"]{color:var(--hot);background:var(--cap-on);box-shadow:inset 0 -3px 0 #3b4166, 0 0 12px rgba(160,180,255,.25)}
.keys button[aria-pressed="true"] kbd{color:var(--hot);text-shadow:0 0 6px rgba(255,255,255,.7)}
.keys button:focus-visible,.toggle:focus-visible{outline:2px solid #fff;outline-offset:2px}
.controls{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:4px;transition:opacity .4s}
.toggle{font:inherit;font-size:8px;color:var(--dim);background:transparent;border:0;padding:8px;cursor:pointer}
.toggle:hover{color:var(--ink)}
body.full:not(.active){cursor:none}
body.full:not(.active) .controls{opacity:0;pointer-events:none}
body.keys-hidden .controls{opacity:0;pointer-events:none}
body.keys-hidden .toast{display:none}
@media (max-width:640px){ .keys button .nm{display:none} .keys button{padding:8px 9px 11px;font-size:9px} }
</style>
</head>
<body>
<canvas id="bgc" aria-hidden="true"></canvas>
<canvas id="glow" aria-hidden="true"></canvas>
<canvas id="screen" aria-label="Animated pixel face"></canvas>
<div class="crt"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="controls">
  <button class="toggle" id="fs" type="button">Enter fullscreen</button>
  <button class="toggle" id="snd" type="button">⌫ sound on</button>
  <button class="toggle" id="toggle" type="button" aria-controls="keys">H hide keys</button>
</div>
<nav class="keys" id="keys" aria-label="Expressions"></nav>

<script>
(() => {
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const FW = 32, FH = 24;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, cell, cols, rows, ox, oy, offX, offY, bg;
const UNLIT = [11, 12, 19];
const WHITE = '#f4f6ff';

/* ---------- color + math utils ---------- */
const rgbCache = new Map();
function rgb(hex){ let v = rgbCache.get(hex); if(!v){ const n = parseInt(hex.slice(1),16); v = [n>>16&255, n>>8&255, n&255]; rgbCache.set(hex,v); } return v; }
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(c){ return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; }
function hash(i){ let h = Math.imul((i|0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h>>>13; h = Math.imul(h, 0xc2b2ae35); h ^= h>>>16; return (h>>>0)/4294967296; }
const TO_WHITE = [255,255,255];

/* ---------- retro sound effects (synthesized live with Web Audio, no files needed) ---------- */
const m2f=n=>440*Math.pow(2,(n-69)/12);
const cross=(t,dt,P,at=0)=>dt>0&&t>=at&&Math.floor((t-at)/P)>Math.floor((t-dt-at)/P);
const SFX={
  ctx:null, out:null, noiseBuf:null, on:true, vol:.6, base:0,
  init(){
    if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ this.ctx=new AC(); }catch(e){ return; }
    const comp=this.ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=6;
    this.out=this.ctx.createGain(); this.out.gain.value=this.on?this.vol:0;
    this.out.connect(comp); comp.connect(this.ctx.destination);
    const len=this.ctx.sampleRate, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.noiseBuf=buf;
  },
  wake(){ this.init(); if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  ready(){ return this.on&&this.ctx&&this.ctx.state==='running'; },
  setOn(v){ this.on=v; if(this.out) this.out.gain.setTargetAtTime(v?this.vol:0,this.ctx.currentTime,.02); },
  setVol(v){ this.vol=Math.max(.05,Math.min(1,v)); if(this.out&&this.on) this.out.gain.setTargetAtTime(this.vol,this.ctx.currentTime,.02); },
  tone(f,dur,o={}){
    if(!this.ready()) return;
    const c=this.ctx, t0=c.currentTime+this.base+(o.at||0);
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'square';
    osc.frequency.setValueAtTime(f,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+dur);
    const v=o.vol??.15, att=o.att??.004;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+att); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    if(o.vib){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=o.vibRate||7; lg.gain.value=o.vib; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0+dur+.05); }
    osc.connect(g); g.connect(this.out); osc.start(t0); osc.stop(t0+dur+.05);
  },
  noise(dur,o={}){
    if(!this.ready()) return;
    const c=this.ctx, t0=c.currentTime+this.base+(o.at||0);
    const src=c.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true;
    const flt=c.createBiquadFilter(); flt.type=o.filter||'bandpass'; flt.Q.value=o.q||1;
    flt.frequency.setValueAtTime(o.f||1200,t0); if(o.to) flt.frequency.exponentialRampToValueAtTime(o.to,t0+dur);
    const g=c.createGain(), v=o.vol??.15, att=o.att??.004;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+att); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    src.connect(flt); flt.connect(g); g.connect(this.out); src.start(t0,Math.random()*.5); src.stop(t0+dur+.05);
  },
  arp(notes,step,o={}){ notes.forEach((n,i)=>{ if(n) this.tone(m2f(n),o.dur||step*1.1,{...o,at:(o.at||0)+i*step}); }); },
};

/* ---------- frame of lit pixel blocks ---------- */
const hexNum = new Map();
function pack(c){
  if(typeof c==='string'){ let v=hexNum.get(c); if(v===undefined){ v=parseInt(c.slice(1),16); hexNum.set(c,v); } return v; }
  const r=c[0]<0?0:c[0]>255?255:c[0]|0, g=c[1]<0?0:c[1]>255?255:c[1]|0, b=c[2]<0?0:c[2]>255?255:c[2]|0;
  return (r<<16)|(g<<8)|b;
}
/* A frame is a reusable buffer of lit cells: packed color (-1 = off), glow, and a list of lit indices. */
class Frame{
  constructor(n){ this.c=new Int32Array(n).fill(-1); this.g=new Float32Array(n); this.list=new Int32Array(n); this.n=0; }
  clear(){ const c=this.c, l=this.list; for(let i=0;i<this.n;i++) c[l[i]]=-1; this.n=0; }
  set(k,c,g){ if(this.c[k]<0) this.list[this.n++]=k; this.c[k]=c; this.g[k]=g; }
  s(x,y,c,g=0){ x=Math.round(x); y=Math.round(y); if(x<0||y<0||x>=cols||y>=rows) return; this.set(y*cols+x,pack(c),g); }
  p(x,y,c,g=0){ this.s(x+ox, y+oy, c, g); }
  copyFrom(o){ this.clear(); for(let i=0;i<o.n;i++){ const k=o.list[i]; this.set(k,o.c[k],o.g[k]); } }
}

/* ---------- drawing helpers (face coords unless screen:true) ---------- */
function spr(f, rws, x, y, pal, o={}){
  const flip=o.flip, screen=o.screen;
  let w=0; for(const r of rws) w=Math.max(w,r.length);
  for(let r=0;r<rws.length;r++){
    const row=rws[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c]; if(ch==='.') continue;
      let e=pal[ch]; if(!e) continue;
      if(typeof e==='function') e=e(c,r); if(!e) continue;
      const col = Array.isArray(e)?e[0]:e, g = Array.isArray(e)?e[1]:0;
      const xx = x + (flip ? (w-1-c) : c);
      screen ? f.s(xx,y+r,col,g) : f.p(xx,y+r,col,g);
    }
  }
}
function oval(f,x,y,w,h,col,g=0){
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    if(w>2&&h>2&&(i===0||i===w-1)&&(j===0||j===h-1)) continue;
    f.p(x+i,y+j,col,g);
  }
}
function ring(f,x,y,w,h,col,g=0){
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const edge=i===0||j===0||i===w-1||j===h-1;
    const corner=(i===0||i===w-1)&&(j===0||j===h-1);
    if(edge&&!corner) f.p(x+i,y+j,col,g);
  }
}
function curve(f,cx,y0,hw,depth,col,g=0,thick=1){
  let prev=null;
  for(let x=Math.ceil(cx-hw); x<=Math.floor(cx+hw); x++){
    const u=(x-cx)/hw, y=Math.round(y0-depth*u*u);
    if(prev!==null && Math.abs(y-prev)>1){ const d=Math.sign(y-prev); for(let yy=prev+d; yy!==y; yy+=d) f.p(x,yy,col,g); }
    for(let k=0;k<thick;k++) f.p(x,y+k,col,g);
    prev=y;
  }
}
function mpts(f,list,col,g=0,dx=0,dy=0){ for(const [x,y] of list){ f.p(x+dx,y+dy,col,g); f.p(FW-1-x+dx,y+dy,col,g); } }
function blush(f,col,y0=12,g=.15,dy=0){ for(let y=y0;y<y0+2;y++) for(let x=4;x<8;x++) if((x+y)%2===0){ f.p(x,y+dy,col,g); f.p(FW-1-x,y+dy,col,g); } }
function star(f,x,y,col,size,g=.8,screen=false){
  const P = screen ? (a,b,c,d)=>f.s(a,b,c,d) : (a,b,c,d)=>f.p(a,b,c,d);
  P(x,y,'#ffffff',g);
  if(size>=1){ P(x-1,y,col,g*.7); P(x+1,y,col,g*.7); P(x,y-1,col,g*.7); P(x,y+1,col,g*.7); }
  if(size>=2){ P(x-2,y,col,g*.4); P(x+2,y,col,g*.4); P(x,y-2,col,g*.4); P(x,y+2,col,g*.4); }
}
function twinkles(f,t,list,colors,speed=1.2){
  list.forEach(([x,y],i)=>{
    const v=(t*speed+hash(i*101+7))%1;
    const size = v<.12?2 : v<.3?1 : v<.45?0 : -1;
    if(size>=0) star(f,x,y,colors[i%colors.length],size);
  });
}

/* ---------- sprites ---------- */
const HEART_BIG=[".XX.XX.","XhXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."];
const HEART_SM=[".X.X.","XhXXX","XXXXX",".XXX.","..X.."];
const HEART_TINY=["X.X","XXX",".X."];
const HORN=["X.....","XX....","xXX...","xxXX..",".xxXXX","..xXXX"];
const EVIL_BROW=[[4,3],[5,3],[6,4],[7,4],[8,5],[9,5],[10,6],[11,6],[12,7]];
const DOE=[
"..KKKKK..",
".KKaaaKK.",
"KWaaSaaWK",
"KaaSSSaaK",
"KbbbSbbbK",
"KbbbbbbbK",
"KbccccsbK",
"KWcccccWK",
".KWcccWK.",
"..KKKKK..",
];
const SPARK=["...X...","...X...","..XOX..","XXOOOXX","..XOX..","...X...","...X..."];
const SPARK_SM=["..X..","..X..","XXOXX","..X..","..X.."];
const CONTENT_EYE=[[8,6],[9,6],[10,6],[11,6],[7,7],[8,7],[11,7],[12,7],[6,8],[7,8],[12,8],[13,8],[6,9],[13,9]];
const SAD_EYE=["..XX",".XhX","XXXX","XXXX",".XX."];
const SAD_BROW=[[7,3],[8,3],[9,2],[10,2],[11,1]];
const ARC_UP=[[7,9],[8,8],[9,7],[10,7],[11,8],[12,9]];
const ARC_DOWN=[[7,7],[8,8],[9,8],[10,8],[11,8],[12,7]];
const Z_SM=["XXXX","..X.",".X..","XXXX"];
const Z_BIG=["XXXXX","...X.","..X..",".X...","XXXXX"];
const NOTE=["..XX.","..X.X","..X..","XXX..","XXX.."];
const BANG=["XX","XX","XX","..","XX"];
const DROP=[".X.","XXX","XXX",".X."];
const ONE=[".X.","XX.",".X.",".X.","XXX"];
const UNI=[
"...KKKKK.KK.....",
".HKPPPPPKWWK....",
".KHPVVVVPKWWK...",
"KPKPVVKKKPWWK...",
"KKVKVKWWWWKW....",
".KVVKWWWKWWPK...",
"..KKWKKKWWWKPK..",
"...WKGGgKWWKPK..",
"..KWWKGgKWKPPK..",
"..WWWKgKWKPPVK..",
"...WWWWWWKPKK...",
"....WWWWKPKVVK..",
"......KWKKVVVK..",

"....KWWWKWK.....",
"....KWWWKWWK....",
"....KWWKWWWK.KK.",
".....WWKWWKKKVVK",

".....KWKWWK..PPV",
".....KWKWK...PV.",
".....KWKWWK.PPPV",
".....KKKWWK.P..P",
".......KKKK.....",
];
const TROPHY=[
"...LLLLLLLLLLLLLL...",
"...GGGGGGGGGGGGGG...",
"GGGGGGGGGGGGGGGGGGGG",
"G..GGGGGGGGGGGGGG..G",
"G..GGGGGGGGGGGGGG..G",
"G..GGGGGGGGGGGGGG..G",
".G.GGGGGGGGGGGGGG.G.",
"..GGGGGGGGGGGGGGGG..",
"....GGGGGGGGGGGG....",
".....GGGGGGGGGG.....",
"......DGGGGGGD......",
"........GGGG........",
".........GG.........",
".........GG.........",
"........GGGG........",
".......DDDDDD.......",
"......DDDDDDDD......",
".....BBBBBBBBBB.....",
".....BbbbbbbbbB.....",
"....BBBBBBBBBBBB....",
];
const FROG_SIT=[
"......GGG...",
".....GWWkG..",
"..GGGGWWkGG.",
".GGGGGGGGGGG",
"GGGGGGGGGmmm",
"GgggggggGGGG",
"GGgggggGG...",
".GG..GGG....",
"GGGG.GGGG...",
];
const FROG_LEAP=[
"......GGG...",
".....GWWkG..",
"..GGGGWWkGG.",

"GGGGGGGGGmmm",

"GGggggGG....",
"GG..........",
"GGG.........",
];
const FLY_A=["..ww.","YYBBB"];
const FLY_B=[".....","YYBBB","..ww."];
const RAIN=['#ff3b3b','#ff9f1c','#ffe14d','#4ade80','#38bdf8','#a78bfa'];

/* ---------- expressions ---------- */
function edgarMouth(f){
  for(let i=0;i<3;i++) for(let j=15;j<18;j++){ f.p(3+i,j,WHITE,.35); f.p(26+i,j,WHITE,.35); }
  for(let x=6;x<=25;x++) for(let j=18;j<21;j++) f.p(x,j,WHITE,.35);
}
function edgarEye(f,ex,closed,look=0){
  for(let i=0;i<6;i++) for(let j=closed?7:3;j<9;j++) f.p(ex+i+look,j,WHITE,.45);
}
function renderHello(f,t){
  const blink=(t%4.2)>3.95;
  const look=[0,0,0,1,1,0,0,-1,-1,0][Math.floor(t/0.9)%10];
  edgarEye(f,3,blink,look); edgarEye(f,23,blink,look);
  edgarMouth(f);
}

function renderLove(f,t){
  const ph=(t*1.5)%1, big=ph<.16||(ph>.28&&ph<.42);
  const pal={X:['#ff2e63',.9],h:['#ffd6e0',.6]};
  if(big){ spr(f,HEART_BIG,6,4,pal); spr(f,HEART_BIG,19,4,pal); }
  else { spr(f,HEART_SM,7,5,pal); spr(f,HEART_SM,20,5,pal); }
  const mouth=[[14,5,26],[15,5,26],[16,6,25],[17,7,24],[18,9,22],[19,12,19]];
  for(const [y,a,b] of mouth) for(let x=a;x<=b;x++) f.p(x,y,WHITE,.35);
  const xs=[-4,0,29,33,-2,31,3];
  for(let i=0;i<xs.length;i++){
    const sp=2.2+hash(i*7)*1.8, span=34;
    const y=FH+3-((t*sp*2+hash(i*13)*span)%span);
    const x=Math.round(xs[i]+Math.sin(t*1.5+i)*1.2);
    spr(f,HEART_TINY,x,Math.round(y),{X:[['#ff4f7e','#ff8fb1','#ffc2d4'][i%3],.6]});
  }
}

function renderEvil(f,t){
  // sinister trickster: heavy-lidded shifty eyes, one arching brow, lopsided fanged smirk, snickering
  const lc=t%4.5, snicker=lc>3.3&&lc<4.3;
  const sh=snicker&&!reduced?(Math.floor(t*16)%2?-1:0):0;
  const pulse=.6+.4*Math.sin(t*6);
  const raise=!snicker&&(t%6)>2&&(t%6)<3.4;
  const look=snicker?0:[0,0,-1,-1,0,1,1,0][Math.floor(t/.45)%8];
  const EYE='#eef6ff', LID='#ff3347', BROW='#c8102e', MOUTH='#ff3347';
  const hornPal={X:(c,r)=>r<2?['#ff6a3d',.7]:['#e01b2b',.2],x:['#9b0f1c',.05]};
  spr(f,HORN,2,-5+sh,hornPal); spr(f,HORN,24,-5+sh,hornPal,{flip:true});
  for(const side of [0,1]){
    const X=x=>side?FW-1-x:x;
    const rowsE=snicker?[[9,6,11],[10,5,11]]:[[9,6,11],[10,5,11],[11,6,10]];
    for(const [y,a,b] of rowsE) for(let x=a;x<=b;x++) f.p(X(x),y+sh,EYE,.3);
    for(let x=5;x<=12;x++) f.p(X(x),8+sh,LID,.35);
    f.p(X(12),9+sh,LID,.35);
  }
  for(const base of [8,22]){
    const px=base+look, py=9+sh;
    f.p(px,py,'#ffffff',.6); f.p(px+1,py,'#c4102b',pulse); f.p(px,py+1,'#c4102b',pulse); f.p(px+1,py+1,'#c4102b',pulse);
  }
  const BL=[[4,3],[5,3],[6,4],[7,4],[8,5],[9,5],[10,6],[11,6]];
  const BR=raise?[[20,4],[21,3],[22,2],[23,2],[24,2],[25,3],[26,3],[27,4]]:BL.map(([x,y])=>[FW-1-x,y]);

const CLOUD=["....XXX.....","..XXXXXXX...",".XXXXXXXXXX.","XXXXXXXXXXXX",".xxxxxxxxxx."];
const RAINBOW=['#ff3b3b','#ff8a1f','#ffe14d','#4ade80','#38bdf8','#5b6cff','#b45cf0'];
function renderRainbow(f,t){
  const cx=15.5, cy=20, R0=19, bw=1.6;
  // intro: the arc grows out of the left cloud and sweeps over to the right, then the loop takes over
  const g=Math.max(0,Math.min(1,(t-.35)/1.6)), ease=1-(1-g)*(1-g), front=Math.PI*(1-ease), growing=g<1;
  for(let y=0;y<=cy;y++) for(let x=-6;x<=37;x++){
    const d=Math.hypot(x-cx,y-cy); if(d>R0||d<R0-7*bw) continue;
    const th=Math.atan2(cy-y,x-cx);
    if(th<front) continue;
    const band=Math.min(6,Math.floor((R0-d)/bw));
    const c=rgb(RAINBOW[band]);
    if(growing){ const tip=th-front<.14; f.p(x,y,tip?mix(c,TO_WHITE,.6):c,tip?1:.35); continue; }
    const wave=Math.sin(th*6-t*4)>.82;
    f.p(x,y,wave?mix(c,TO_WHITE,.4):c,wave?.7:.35);
  }
  const cpal={X:['#f4f6ff',.25],x:'#c9cfe6'};
  spr(f,CLOUD,-5,16+(Math.sin(t*1.3)>0?0:1),cpal);
  if(ease>.85) spr(f,CLOUD,25,16+(Math.sin(t*1.3)>0?1:0),cpal);
  if(t<2.25) return;
  const blink=(t%4)>3.8;
  for(const ex of [12,18]){ if(blink){ f.p(ex,16,WHITE,.4); f.p(ex+1,16,WHITE,.4); } else { f.p(ex,15,WHITE,.4); f.p(ex+1,15,WHITE,.4); f.p(ex,16,WHITE,.4); f.p(ex+1,16,WHITE,.4); } }
  f.p(11,17,WHITE,.4); f.p(20,17,WHITE,.4);
  for(let x=12;x<=19;x++) f.p(x,18,WHITE,.4);
  twinkles(f,t,[[1,2],[30,1],[-4,9],[35,8],[15,-3],[3,13],[28,12]],RAINBOW,1.1);
}

const EYE_COLS=['#ffe14d','#7dff6a','#ff3b3b','#c084fc','#ff9f1c','#4de0ff'];
let eyeSlotsKey='', eyeSlots=[];
function getEyeSlots(){
  const key=cols+'x'+rows; if(key===eyeSlotsKey) return eyeSlots;
  eyeSlotsKey=key; eyeSlots=[];
  const sw=12, sh=7, nx=Math.floor(cols/sw), ny=Math.floor(rows/sh);
  let i=0;
  for(let gy=0;gy<ny;gy++) for(let gx=0;gx<nx;gx++){
    const k=gy*nx+gx; if(hash(k*13+5)<.3) continue;
    const x=gx*sw+2+Math.floor(hash(k*7+1)*3), y=gy*sh+1+Math.floor(hash(k*3+2)*3);
    if(x+9>=ox+1&&x<=ox+30&&y+3>=oy+1&&y<=oy+10) continue;   // keep the AI's own eyes clear
    eyeSlots.push({x,y,col:EYE_COLS[k%EYE_COLS.length],open:.2+hash(k*5+3)*2.2,close:7+hash(k*11+4),ph:hash(k*17)*4,size:hash(k*19)<.3?1:0,i:i++});
  }
  return eyeSlots;
}
function renderEyesDark(f,t){
  const cyc=t%9;
  for(const s of getEyeSlots()){
    if(cyc<s.open||cyc>s.close) continue;
    const squint=cyc-s.open<.15||s.close-cyc<.15||((cyc+s.ph)%3.3)<.13;
    const look=Math.round(Math.sin(cyc*.9+s.i));
    const w=3+s.size, h=2+s.size;
    for(const ex of [s.x,s.x+w+2]){
      for(let j=squint?h-1:0;j<h;j++) for(let i=0;i<w;i++) f.s(ex+i,s.y+j,s.col,.6);
      if(!squint) f.s(ex+1+look,s.y+h-1,'#140a0a');
    }
  }
  if(cyc>2.6&&cyc<7.4){
    const closed=cyc-2.6<.15||7.4-cyc<.15||((cyc%3)>2.85);
    const look=[0,0,1,1,0,-1,-1,0][Math.floor(cyc/.6)%8];
    edgarEye(f,3,closed,look); edgarEye(f,23,closed,look);
  }
}

const BIG={B:["XXXX.","X...X","X...X","XXXX.","X...X","X...X","XXXX."],O:[".XXX.","X...X","X...X","X...X","X...X","X...X",".XXX."],'!':["XX","XX","XX","XX","XX","..","XX"]};
function drawGhost(f,cx,cy,sc,t,dim){
  const hw=Math.min(cols*.46,rows*.62)*sc, h=rows*.92*sc, top=cy-h/2;
  const ecy=top+.44*h, el=cx-.36*hw, er=cx+.36*hw;
  for(let y=Math.floor(top);y<=Math.ceil(top+h);y++) for(let x=Math.floor(cx-hw);x<=Math.ceil(cx+hw);x++){
    const u=(x-cx)/hw, v=(y-top)/h;
    if(v<0||Math.abs(u)>1) continue;
    let inside;
    if(v<.45){ const dv=(v-.45)/.45; inside=u*u+dv*dv<=1; } else inside=v<=.9+.07*Math.sin(u*Math.PI*3.5+t*9);
    if(!inside) continue;
    const eu=Math.abs(u)-.36, ev=v-.44;
    if((eu*eu)/(.17*.17)+(ev*ev)/(.13*.13)<=1){
      if(Math.abs(y-ecy)<=.6&&(Math.abs(x-el)<=.6||Math.abs(x-er)<=.6)) f.s(x,y,'#ff2a2a',1-dim);
      continue;
    }
    const mu=u/.2, mv=(v-.73)/.14; if(mu*mu+mv*mv<=1) continue;
    let c=mix([244,246,255],[150,170,255],u*u*.7); if(dim) c=mix(c,[0,0,0],dim);
    f.s(x,y,c,.45*(1-dim));
  }
}

/* Lights out: flicker, darkness with dripping, then huge red eyes and a toothy grin snap open */
function drawBigEyes(f,sc,blink,fade,t){
  const ew=cols*.2*sc, eh=rows*.17*sc, cy=rows*.38;
  for(const side of [-1,1]){
    const cx=cols/2+side*cols*.17*sc;
    for(let y=Math.floor(cy-eh/2);y<=Math.ceil(cy+eh/2);y++) for(let x=Math.floor(cx-ew/2);x<=Math.ceil(cx+ew/2);x++){
      const u=(x-cx)/(ew/2), v=(y-cy)/(eh/2);
      if(Math.abs(u)>1||Math.abs(v)>1-u*u) continue;
      if(blink&&Math.abs(y-cy)>.6) continue;
      const slit=Math.abs(x-cx)<Math.max(.6,ew*.05);
      let c=slit?[30,0,0]:mix([255,70,40],[150,0,20],Math.min(1,Math.hypot(u,v)));
      if(fade) c=mix(c,[0,0,0],fade);
      f.s(x,y,c,slit?0:.9*(1-fade));
    }
  }
}
function drawToothyGrin(f,fade){

}

    const fr=Math.floor(t*20), roll=(c%RP)/RP, barY=roll*rows*1.3-rows*.15, idx=Math.floor(c/RP);
    let sc=.18+Math.min(idx,this.rolls)*.11;

let maxDpr=2, slowFrames=0;

function resize(){
  W=innerWidth; H=innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,maxDpr);
  while(dpr>1 && W*H*dpr*dpr>4.5e6) dpr-=.25;          // cap backing store on big/4K screens
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  cell=Math.max(6,Math.floor(Math.min(W*.7/FW,H*.7/FH)));
  cols=FW+2*Math.ceil((W/cell-FW)/2);
  rows=FH+2*Math.ceil((H/cell-FH)/2);
  ox=(cols-FW)/2; oy=(rows-FH)/2;
  offX=(W-cols*cell)/2; offY=(H-rows*cell)/2;
  const gap=Math.max(1,Math.round(cell*.12));
  stampPx=Math.max(2,Math.round((cell-gap)*dpr));
  pxD=new Int32Array(cols); pyD=new Int32Array(rows);
  for(let x=0;x<cols;x++) pxD[x]=Math.round((offX+x*cell+gap/2)*dpr);
  for(let y=0;y<rows;y++) pyD[y]=Math.round((offY+y*cell+gap/2)*dpr);
  // glow is painted on a small canvas (about 6px per cell) and scaled up: soft bloom for a fraction of the cost
  gq=Math.min(1,6/cell);
  glowC.width=Math.max(1,Math.ceil(W*gq)); glowC.height=Math.max(1,Math.ceil(H*gq));
  glowC.style.width=(glowC.width/gq)+'px'; glowC.style.height=(glowC.height/gq)+'px';
  gS=Math.max(4,Math.round(cell*gq*3));
  gpx=new Float32Array(cols); gpy=new Float32Array(rows);
  for(let x=0;x<cols;x++) gpx[x]=(offX+(x+.5)*cell)*gq-gS/2;
  for(let y=0;y<rows;y++) gpy[y]=(offY+(y+.5)*cell)*gq-gS/2;
  stampCache.clear(); glowCache.clear();
  const n=cols*rows;
  R=new Frame(n); S=new Frame(n); F=new Frame(n);
  thr=new Float32Array(n);
  const cx=cols/2, cy=rows/2, maxd=Math.hypot(cx,cy);
  for(let k=0;k<n;k++){ const x=k%cols, y=(k/cols)|0; thr[k]=hash(k)*.55+(Math.hypot(x-cx,y-cy)/maxd)*.2; }
  // unlit LED studs, drawn once
  bg=bgC; bg.width=canvas.width; bg.height=canvas.height;
  const b=bg.getContext('2d');
  b.fillStyle='#000'; b.fillRect(0,0,bg.width,bg.height);
  const off=makeStamp(7,8,12,13,14,22);
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) b.drawImage(off,pxD[x],pyD[y]);
  trans=null;
  if(mode&&mode.init) mode.init();
}

function makeStamp(r,g,b,cr,cg,cb){
  const c=document.createElement('canvas'); c.width=c.height=stampPx;
  const x=c.getContext('2d'), s=stampPx;
  x.fillStyle=css([r,g,b]); x.fillRect(0,0,s,s);
  x.fillStyle=css([cr,cg,cb]); x.beginPath(); x.arc(s/2,s/2,s*.4,0,Math.PI*2); x.fill();
  return c;
}
/* One pre-rendered block per color (5 bits per channel), reused with a single drawImage. */
function stampFor(c){
  const key=((c>>19)&31)<<10|((c>>11)&31)<<5|((c>>3)&31);
  let st=stampCache.get(key); if(st) return st;
  if(stampCache.size>3000) stampCache.clear();
  const k=255/31, r=((key>>10)&31)*k, g=((key>>5)&31)*k, b=(key&31)*k, s=stampPx;
  st=document.createElement('canvas'); st.width=st.height=s;
  const x=st.getContext('2d');
  x.fillStyle=css([r*.55,g*.55,b*.55]); x.fillRect(0,0,s,s);
  x.fillStyle=css([r*.78,g*.78,b*.78]); x.beginPath(); x.moveTo(0,0); x.lineTo(s,0); x.lineTo(0,s); x.closePath(); x.fill();
  x.fillStyle=css([r,g,b]); x.beginPath(); x.arc(s/2,s/2,s*.4,0,Math.PI*2); x.fill();
  if(s>=14){ x.fillStyle=css(mix([r,g,b],TO_WHITE,.55)); x.beginPath(); x.arc(s*.37,s*.37,s*.09,0,Math.PI*2); x.fill(); }
  stampCache.set(key,st); return st;
}
function glowFor(c){
  const key=((c>>20)&15)<<8|((c>>12)&15)<<4|((c>>4)&15);
  let gl=glowCache.get(key); if(gl) return gl;
  const k=255/15, r=((key>>8)&15)*k|0, g=((key>>4)&15)*k|0, b=(key&15)*k|0;
  gl=document.createElement('canvas'); gl.width=gl.height=gS;
  const x=gl.getContext('2d'), grd=x.createRadialGradient(gS/2,gS/2,0,gS/2,gS/2,gS/2);
  grd.addColorStop(0,`rgba(${r},${g},${b},.75)`); grd.addColorStop(.4,`rgba(${r},${g},${b},.28)`); grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=grd; x.fillRect(0,0,gS,gS);
  glowCache.set(key,gl); return gl;
}

/* ---------- render pipeline ---------- */
let mode=MODES[0], modeT=0, last=performance.now(), trans=null;
const UNLIT_P=(UNLIT[0]<<16)|(UNLIT[1]<<8)|UNLIT[2];

function blendCell(k,A,B,out,p){
  const l=(p-thr[k])/.25, ca=A.c[k], cb=B.c[k];
  if(l<=0){ if(ca>=0) out.set(k,ca,A.g[k]); return; }
  if(l>=1){ if(cb>=0) out.set(k,cb,B.g[k]); return; }
  const fl=Math.sin(l*Math.PI)*.35, a=ca>=0?ca:UNLIT_P, b=cb>=0?cb:UNLIT_P, il=1-l;
  let r=((a>>16)&255)*il+((b>>16)&255)*l, g=((a>>8)&255)*il+((b>>8)&255)*l, bl=(a&255)*il+(b&255)*l;
  r+=(255-r)*fl; g+=(255-g)*fl; bl+=(255-bl)*fl;
  out.set(k,(r<<16)|(g<<8)|(bl|0),(ca>=0?A.g[k]:0)*il+(cb>=0?B.g[k]:0)*l+fl*.5);
}
function blend(A,B,out,p){
  out.clear();
  for(let i=0;i<A.n;i++) blendCell(A.list[i],A,B,out,p);
  for(let i=0;i<B.n;i++){ const k=B.list[i]; if(A.c[k]<0) blendCell(k,A,B,out,p); }
}

function draw(fr){
  const list=fr.list, n=fr.n, C=fr.c, G=fr.g;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  gctx.globalCompositeOperation='source-over'; gctx.globalAlpha=1;
  gctx.clearRect(0,0,glowC.width,glowC.height);
  gctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const k=list[i], g=G[k]; if(g<.08) continue;
    gctx.globalAlpha=g>1?1:g;
    gctx.drawImage(glowFor(C[k]),gpx[k%cols],gpy[(k/cols)|0]);
  }
  for(let i=0;i<n;i++){ const k=list[i]; ctx.drawImage(stampFor(C[k]),pxD[k%cols],pyD[(k/cols)|0]); }
}

function frame(now){
  const dt=Math.min(.1,(now-last)/1000); last=now; modeT+=dt;
  R.clear(); mode.render(R,modeT,dt);
  if(mode.sound) mode.sound(modeT,dt);
  if(trans){
    const p=(now-trans.t0)/trans.dur;
    if(p>=1) trans=null; else blend(F,R,S,p);
  }
  if(!trans){ const t=S; S=R; R=t; }   // shown = freshly rendered frame, no copy
  draw(S);
  // adaptive quality: if frames stay slow (< ~40fps) for ~2s, lower the internal resolution a step
  slowFrames = dt>.025 ? slowFrames+1 : Math.max(0,slowFrames-2);
  if(slowFrames>60 && dpr>1){ maxDpr=Math.max(1,dpr-.5); slowFrames=0; resize(); }
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
const keysEl=document.getElementById('keys'), toastEl=document.getElementById('toast'), toggleEl=document.getElementById('toggle'), fsEl=document.getElementById('fs');
const buttons=new Map();
for(const m of MODES){
  const b=document.createElement('button');
  b.type='button'; b.setAttribute('aria-pressed','false');
  b.innerHTML=`<kbd>${m.cap}</kbd><span class="nm">${m.name}</span>`;
  b.title=m.name; b.setAttribute('aria-label',`${m.name} (${m.cap})`);
  b.addEventListener('click',()=>setMode(m));
  keysEl.appendChild(b); buttons.set(m,b);
}
let toastTimer;
function toast(txt){ toastEl.textContent=txt; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1400); }
function setMode(m){
  if(m===mode&&!trans) return;
  F.copyFrom(S);                                   // freeze what's on screen
  trans={t0:performance.now(),dur:reduced?280:750};
  mode=m; modeT=0; if(m.init) m.init();
  // "the AI is thinking" chirp, then the expression's own sound
  SFX.base=0; SFX.tone(2400,.025,{vol:.04}); SFX.tone(1800,.025,{vol:.04,at:.05}); SFX.tone(3000,.03,{vol:.04,at:.1});
  SFX.base=.18; if(m.enter) m.enter(); SFX.base=0;
  for(const [mm,b] of buttons) b.setAttribute('aria-pressed',mm===m?'true':'false');
  toast(m.name);
}

/* fullscreen + kiosk behaviour */
const fsActive=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const isFull=()=>fsActive()
  || matchMedia('(display-mode: fullscreen)').matches
  || (outerHeight-innerHeight<2 && outerWidth-innerWidth<2 && outerWidth>=screen.width-1 && outerHeight>=screen.height-1); // kiosk / F11: no browser chrome
let userKeys=null;                                   // null = automatic (hidden when fullscreen)
function applyChrome(){
  const full=isFull(), hide=userKeys===null?full:!userKeys;
  keysEl.classList.toggle('hidden',hide);
  document.body.classList.toggle('keys-hidden',hide);
  toggleEl.textContent=hide?'H show keys':'H hide keys';
  fsEl.textContent=fsActive()?'Exit fullscreen':'Enter fullscreen';
  document.body.classList.toggle('full',full);
}
function toggleKeys(){ userKeys=keysEl.classList.contains('hidden'); applyChrome(); }
function toggleFS(){
  const d=document.documentElement;
  try{
    if(fsActive()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    const req=d.requestFullscreen||d.webkitRequestFullscreen;
    if(!req) throw new Error('unsupported');
    const pr=req.call(d,{navigationUI:'hide'});
    if(pr&&pr.catch) pr.catch(()=>toast('Fullscreen isn’t available here'));
  }catch(e){ toast('Fullscreen isn’t available here'); }
}
let idleTimer;
function wake(){ document.body.classList.add('active'); clearTimeout(idleTimer); idleTimer=setTimeout(()=>document.body.classList.remove('active'),2500); }
addEventListener('pointermove',wake);
const sndEl=document.getElementById('snd');
function toggleSound(){ SFX.wake(); SFX.setOn(!SFX.on); sndEl.textContent=SFX.on?'⌫ sound on':'⌫ sound off'; toast(SFX.on?'Sound on':'Sound off'); }
sndEl.addEventListener('click',toggleSound);
addEventListener('pointerdown',()=>SFX.wake());
SFX.wake();   // starts right away in kiosk mode; otherwise on the first key or tap
toggleEl.addEventListener('click',toggleKeys);
fsEl.addEventListener('click',toggleFS);
document.addEventListener('fullscreenchange',applyChrome);
document.addEventListener('webkitfullscreenchange',applyChrome);

addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  let k=e.key.toLowerCase();
  if(k==='spacebar') k=' ';
  if(k==='escape') k=' ';
  SFX.wake();
  if(k==='h'||k==='?'){ toggleKeys(); return; }
  if(k==='backspace'){ e.preventDefault(); toggleSound(); return; }
  if(k==='-'||k==='_'){ SFX.setVol(SFX.vol-.1); toast('Volume '+Math.round(SFX.vol*10)); return; }
  if(k==='='||k==='+'){ SFX.setVol(SFX.vol+.1); toast('Volume '+Math.round(SFX.vol*10)); return; }
  if(k==='enter'&&!(e.target instanceof HTMLButtonElement)){ e.preventDefault(); toggleFS(); return; }
  const m=byKey[k];
  if(m){ e.preventDefault(); setMode(m); }
});
// tap = next expression; press and hold 1 second = show/hide the keys (for touch screens with no H key)
let holdTimer=0, held=false;
canvas.addEventListener('pointerdown',()=>{ held=false; clearTimeout(holdTimer); holdTimer=setTimeout(()=>{ held=true; toggleKeys(); },1000); });
for(const ev of ['pointerup','pointerleave','pointercancel']) canvas.addEventListener(ev,()=>clearTimeout(holdTimer));
canvas.addEventListener('click',()=>{ if(held){ held=false; return; } const i=MODES.indexOf(mode); setMode(MODES[(i+1)%MODES.length]); });
let resizeRaf=0;
addEventListener('resize',()=>{ cancelAnimationFrame(resizeRaf); resizeRaf=requestAnimationFrame(()=>{ resize(); applyChrome(); }); });

resize();
applyChrome();
buttons.get(mode).setAttribute('aria-pressed','true');
trans={t0:performance.now(),dur:1100};             // power-on dissolve from a dark screen
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
